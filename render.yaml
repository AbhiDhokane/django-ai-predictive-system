services:
  - type: web
    name: django-ai-predictive-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --workers 1 --threads 4 predictive_maintenance.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: predictive-maintenance-db
          property: connectionString
      - key: MONITORED_MACHINES
        value: "M01,M02,M03"
      - key: ALERT_RISK_THRESHOLD
        value: "75"
      - key: ALERT_COOLDOWN_MINUTES
        value: "30"
      - key: EMAIL_ALERTS_ENABLED
        value: "false"

databases:
  - name: predictive-maintenance-db
    plan: free
